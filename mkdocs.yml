site_name: NestJS Documentation
site_description: Documentación completa de NestJS Framework
site_author: Developer

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

nav:
  - Inicio: index.md
  - Instalación: instalacion.md
  - Módulos y Controladores: modulos-controladores.md
  - Servicios y Providers: servicios-providers.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables

plugins:
  - mermaid2

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nestjs
